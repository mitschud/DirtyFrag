name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;27.0.12077973"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "KEYSTORE_BASE64 is EMPTY"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "KEYSTORE_PASSWORD is EMPTY"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "KEY_ALIAS is EMPTY"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "KEY_PASSWORD is EMPTY"
            exit 1
          }

          echo "All signing secrets are set"
          echo "Alias length: ${#KEY_ALIAS}"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > app/keystore.jks

          echo "Keystore size: $(stat -c%s app/keystore.jks) bytes"

          test -s app/keystore.jks || {
            echo "keystore.jks is empty"
            exit 1
          }

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore app/keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Verify private key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -importkeystore \
            -srckeystore app/keystore.jks \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore /tmp/test-keystore.p12 \
            -deststoretype PKCS12 \
            -deststorepass test123456 \
            -destkeypass test123456 \
            -noprompt

          rm -f /tmp/test-keystore.p12

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: DirtyFrag-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
