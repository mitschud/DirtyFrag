# No androidx anywhere: the UI is framework widgets plus the custom views in df.root,
# so there is nothing here to opt in to. The line that used to sit on this file was
# android.useAndroidX=true, which was the last trace of the library in the build.

# There is no Kotlin source in app/ and AGP's built-in Kotlin support is what puts
# kotlin-stdlib on the runtime classpath, so turning it off is what leaves
# :app:dependencies reporting "No dependencies" rather than one stdlib. Switch it
# back on (or apply the Kotlin plugin properly) the day a .kt file shows up.
android.builtInKotlin=false

